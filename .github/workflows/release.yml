name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - uses: astral-sh/setup-uv@v5

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check version lockstep (tag == wheel version)
        run: |
          V="${{ steps.ver.outputs.version }}"
          grep -q "^version = \"$V\"$" python-api/pyproject.toml \
            || { echo "::error::tag v$V does not match python-api/pyproject.toml version"; exit 1; }

      - name: Build CLI binaries (static, amd64 + arm64)
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          for ARCH in amd64 arm64; do
            ( cd cli && CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" \
                go build -trimpath -ldflags "-s -w -X main.version=$V" \
                -o "../dist/manta-pipeline-linux-$ARCH" . )
          done
          ( cd dist && sha256sum manta-pipeline-linux-* > SHA256SUMS )

      - name: Smoke-test the amd64 binary
        run: |
          chmod +x dist/manta-pipeline-linux-amd64
          dist/manta-pipeline-linux-amd64 version | tee /dev/stderr \
            | grep -q "${{ steps.ver.outputs.version }}"

      - name: Build and validate the wheel
        run: |
          uv build python-api --out-dir dist
          uv venv /tmp/wv
          uv pip install --python /tmp/wv/bin/python dist/*.whl
          /tmp/wv/bin/python -c "import mantapipeline; print('wheel import OK')"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: ${{ github.ref_name }}
          files: |
            dist/manta-pipeline-linux-amd64
            dist/manta-pipeline-linux-arm64
            dist/SHA256SUMS
            dist/*.whl
            dist/*.tar.gz
            install.sh
          body: |
            Dev preview ${{ github.ref_name }} — see CHANGELOG.md. **Not stable.**

            CLI (Ubuntu):
            ```
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh | sh -s -- ${{ github.ref_name }}
            ```
            Python API (authoring):
            ```
            pip install "mantapipeline @ git+https://github.com/${{ github.repository }}.git@${{ github.ref_name }}#subdirectory=python-api"
            ```
