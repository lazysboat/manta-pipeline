[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mantapipeline"
version = "0.1.0.dev1"
description = "Python API for authoring Manta Pipeline works (dev preview)"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["mantapipeline"]
